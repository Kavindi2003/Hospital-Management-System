<!DOCTYPE html>
<html>

<head>

    <title>Appointments</title>

    <link rel="stylesheet" href="/css/style.css">

</head>


<body>


<h1>Hospital Appointments</h1>



<h2>Add Appointment</h2>



<form id="appointmentForm">


    <input type="hidden" id="appointmentId">



    Patient ID

    <input type="number" id="patientId">


    <br>


    Doctor ID

    <input type="number" id="doctorId">


    <br>


    Date

    <input type="datetime-local" id="appointmentDate">


    <br>


    Reason

    <input type="text" id="reason">


    <br>


    <button>
        Save Appointment
    </button>


</form>




<h2>Search</h2>


<input id="searchBox"
       placeholder="Patient ID or Reason">


<button onclick="searchAppointment()">
    Search
</button>


<button onclick="loadAppointments()">
    Show All
</button>





<table>


    <tr>

        <th>ID</th>
        <th>Patient</th>
        <th>Doctor</th>
        <th>Date</th>
        <th>Reason</th>
        <th>Action</th>

    </tr>


    <tbody id="appointmentData">

    </tbody>


</table>



<script src="/js/appointments.js"></script>


</body>

</html>
