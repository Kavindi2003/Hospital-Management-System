<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management</title>
    <style>
        :root {
            --ink: #16232b;
            --paper: #f6f8f7;
            --panel: #ffffff;
            --line: #dde4e2;
            --teal: #1c6e63;
            --teal-dark: #124f47;
            --amber: #c97a2b;
            --danger: #b3432f;
            --muted: #64777a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        header {
            background: var(--teal-dark);
            color: #eef5f3;
            padding: 22px 32px;
            display: flex;
            align-items: baseline;
            gap: 14px;
        }
        header h1 {
            font-size: 20px;
            letter-spacing: 0.02em;
            margin: 0;
            font-weight: 600;
        }
        header span {
            font-size: 13px;
            color: #9fc4bd;
        }
        main {
            max-width: 980px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }
        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 20px 22px;
            margin-bottom: 22px;
        }
        .panel h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin: 0 0 16px 0;
            font-weight: 600;
            border-bottom: 1px solid var(--line);
            padding-bottom: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }
        label {
            font-size: 12px;
            color: var(--muted);
            display: block;
            margin-bottom: 4px;
        }
        input, select {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--line);
            border-radius: 4px;
            font-size: 14px;
            background: var(--paper);
            color: var(--ink);
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--teal);
        }
        .actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }
        button {
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.02em;
        }
        .btn-primary {
            background: var(--teal);
            color: #fff;
        }
        .btn-primary:hover { background: var(--teal-dark); }
        .btn-ghost {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--muted);
        }
        .btn-ghost:hover { border-color: var(--muted); }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }
        th {
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
        }
        td {
            padding: 10px 10px;
            border-bottom: 1px solid var(--line);
        }
        tr:hover td { background: #f0f5f4; }
        .row-actions button {
            padding: 5px 10px;
            font-size: 12px;
            margin-right: 6px;
        }
        .edit-btn { background: #e8eeed; color: var(--teal-dark); }
        .delete-btn { background: #f6e6e2; color: var(--danger); }
        .status {
            font-size: 13px;
            padding: 10px 14px;
            border-radius: 4px;
            margin-bottom: 16px;
            display: none;
        }
        .status.show { display: block; }
        .status.ok { background: #e3f1ec; color: var(--teal-dark); }
        .status.err { background: #f7e5e1; color: var(--danger); }
        .empty {
            text-align: center;
            color: var(--muted);
            padding: 30px 0;
            font-size: 13px;
        }
        .id-tag {
            color: var(--muted);
            font-size: 12px;
        }
    </style>
</head>
<body>

<header>
    <h1>Hospital Management System</h1>
    <span>Patient Records</span>
</header>

<main>

    <div class="status" id="status"></div>

    <div class="panel">
        <h2 id="formTitle">Add New Patient</h2>
        <div class="grid">
            <div>
                <label>First Name</label>
                <input id="firstName" placeholder="e.g. John">
            </div>
            <div>
                <label>Last Name</label>
                <input id="lastName" placeholder="e.g. Silva">
            </div>
            <div>
                <label>Date of Birth</label>
                <input id="dateOfBirth" type="date">
            </div>
            <div>
                <label>Age</label>
                <input id="age" type="number" placeholder="e.g. 35">
            </div>
            <div>
                <label>Gender</label>
                <select id="gender">
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
            <div>
                <label>Blood Group</label>
                <select id="bloodGroup">
                    <option value="">Select</option>
                    <option>O+</option><option>O-</option>
                    <option>A+</option><option>A-</option>
                    <option>B+</option><option>B-</option>
                    <option>AB+</option><option>AB-</option>
                </select>
            </div>
            <div>
                <label>Phone Number</label>
                <input id="phoneNumber" placeholder="e.g. 0771234567">
            </div>
            <div>
                <label>Email</label>
                <input id="email" type="email" placeholder="e.g. john@example.com">
            </div>
            <div>
                <label>Address</label>
                <input id="address" placeholder="e.g. Colombo">
            </div>
        </div>
        <div class="actions">
            <button class="btn-primary" id="saveBtn" onclick="savePatient()">Save Patient</button>
            <button class="btn-ghost" id="cancelBtn" onclick="resetForm()" style="display:none;">Cancel Edit</button>
        </div>
    </div>

    <div class="panel">
        <h2>All Patients</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>DOB</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Blood</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="patientTableBody"></tbody>
        </table>
        <div class="empty" id="emptyState" style="display:none;">No patients yet. Add one above.</div>
    </div>

</main>

<script>
    const API_URL = "http://localhost:8080/api/patients";
    let editingId = null;

    async function loadPatients() {
        try {
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error("Server responded with " + res.status);
            const patients = await res.json();
            renderTable(patients);
        } catch (err) {
            showStatus("Could not connect to server. Is the Spring Boot app running? (" + err.message + ")", "err");
            renderTable([]);
        }
    }

    function renderTable(patients) {
        const body = document.getElementById("patientTableBody");
        const empty = document.getElementById("emptyState");
        body.innerHTML = "";

        if (!patients.length) {
            empty.style.display = "block";
            return;
        }
        empty.style.display = "none";

        patients.forEach(p => {
            const tr = document.createElement("tr");
            const fullName = `${p.firstName || ""} ${p.lastName || ""}`.trim();
            tr.innerHTML = `
        <td class="id-tag">#${p.patientId}</td>
        <td>${escapeHtml(fullName)}</td>
        <td>${escapeHtml(p.dateOfBirth || "")}</td>
        <td>${p.age != null ? p.age : ""}</td>
        <td>${escapeHtml(p.gender || "")}</td>
        <td>${escapeHtml(p.bloodGroup || "")}</td>
        <td>${escapeHtml(p.phoneNumber || "")}</td>
        <td>${escapeHtml(p.email || "")}</td>
        <td>${escapeHtml(p.address || "")}</td>
        <td class="row-actions">
          <button class="edit-btn" onclick="editPatient(${p.patientId})">Edit</button>
          <button class="delete-btn" onclick="deletePatient(${p.patientId})">Delete</button>
        </td>
      `;
            body.appendChild(tr);
            tr.dataset.patient = JSON.stringify(p);
        });
    }

    async function savePatient() {
        const patient = {
            firstName: val("firstName"),
            lastName: val("lastName"),
            dateOfBirth: val("dateOfBirth"),
            age: val("age") ? parseInt(val("age")) : null,
            gender: val("gender"),
            bloodGroup: val("bloodGroup"),
            phoneNumber: val("phoneNumber"),
            email: val("email"),
            address: val("address")
        };

        if (!patient.firstName || !patient.lastName) {
            showStatus("First name and last name are required.", "err");
            return;
        }
        if (!patient.dateOfBirth) {
            showStatus("Date of birth is required.", "err");
            return;
        }
        if (!patient.gender) {
            showStatus("Gender is required.", "err");
            return;
        }

        try {
            let res;
            if (editingId) {
                res = await fetch(`${API_URL}/${editingId}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(patient)
                });
            } else {
                res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(patient)
                });
            }
            if (!res.ok) throw new Error("Server responded with " + res.status);

            showStatus(editingId ? "Patient updated successfully." : "Patient added successfully.", "ok");
            resetForm();
            loadPatients();
        } catch (err) {
            showStatus("Failed to save patient. " + err.message, "err");
        }
    }

    function editPatient(id) {
        const row = [...document.querySelectorAll("#patientTableBody tr")]
            .find(tr => JSON.parse(tr.dataset.patient).patientId === id);
        if (!row) return;
        const p = JSON.parse(row.dataset.patient);

        document.getElementById("firstName").value = p.firstName || "";
        document.getElementById("lastName").value = p.lastName || "";
        document.getElementById("dateOfBirth").value = p.dateOfBirth || "";
        document.getElementById("age").value = p.age || "";
        document.getElementById("gender").value = p.gender || "";
        document.getElementById("bloodGroup").value = p.bloodGroup || "";
        document.getElementById("phoneNumber").value = p.phoneNumber || "";
        document.getElementById("email").value = p.email || "";
        document.getElementById("address").value = p.address || "";

        editingId = id;
        document.getElementById("formTitle").textContent = "Edit Patient #" + id;
        document.getElementById("saveBtn").textContent = "Update Patient";
        document.getElementById("cancelBtn").style.display = "inline-block";
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deletePatient(id) {
        if (!confirm("Delete this patient record? This cannot be undone.")) return;
        try {
            const res = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
            if (!res.ok) throw new Error("Server responded with " + res.status);
            showStatus("Patient deleted.", "ok");
            loadPatients();
        } catch (err) {
            showStatus("Failed to delete patient. " + err.message, "err");
        }
    }

    function resetForm() {
        editingId = null;
        ["firstName","lastName","dateOfBirth","age","gender","bloodGroup","phoneNumber","email","address"].forEach(id => val(id, ""));
        document.getElementById("formTitle").textContent = "Add New Patient";
        document.getElementById("saveBtn").textContent = "Save Patient";
        document.getElementById("cancelBtn").style.display = "none";
    }

    function val(id, set) {
        const el = document.getElementById(id);
        if (set !== undefined) { el.value = set; return; }
        return el.value.trim();
    }

    function showStatus(msg, type) {
        const el = document.getElementById("status");
        el.textContent = msg;
        el.className = "status show " + type;
        setTimeout(() => el.classList.remove("show"), 4000);
    }

    function escapeHtml(str) {
        const d = document.createElement("div");
        d.textContent = str;
        return d.innerHTML;
    }

    loadPatients();
</script>

</body>
</html>
