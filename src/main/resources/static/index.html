<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/landing.css">
</head>
<body>

<nav class="landing-nav">
    <div class="logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M4 21V8l8-5 8 5v13"/>
            <path d="M9 21v-6h6v6"/>
            <path d="M12 11v4M10 13h4"/>
        </svg>
        Hospital Management System
    </div>
</nav>

<section class="hero">
    <div>
        <h1>Modern Healthcare Management</h1>
        <p class="lead">A secure and efficient platform for managing patients, appointments, medical records, staff, pharmacy inventory and billing.</p>
        <a href="/login.html" class="btn btn-primary btn-large">Explore System</a>
    </div>

    <div class="hero-art">
        <svg viewBox="0 0 320 260" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Central cross / hospital mark -->
            <rect x="140" y="60" width="40" height="140" rx="8" fill="var(--accent)" opacity="0.85"/>
            <rect x="90" y="110" width="140" height="40" rx="8" fill="var(--accent)" opacity="0.85"/>

            <!-- Orbiting module nodes, echoing the module cards elsewhere in the app -->
            <circle cx="60" cy="70" r="26" fill="var(--surface-elevated)" stroke="var(--border)"/>
            <path d="M50 70h20M60 60v20" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>

            <circle cx="260" cy="60" r="26" fill="var(--surface-elevated)" stroke="var(--border)"/>
            <rect x="249" y="49" width="22" height="22" rx="3" stroke="var(--accent)" stroke-width="2.2" fill="none"/>

            <circle cx="55" cy="195" r="26" fill="var(--surface-elevated)" stroke="var(--border)"/>
            <path d="M45 195h20M55 185v20" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" transform="rotate(45 55 195)"/>

            <circle cx="265" cy="195" r="26" fill="var(--surface-elevated)" stroke="var(--border)"/>
            <circle cx="265" cy="195" r="9" stroke="var(--accent)" stroke-width="2.2" fill="none"/>

            <!-- Connecting lines -->
            <path d="M84 78 L140 100" stroke="var(--border)" stroke-width="1.5"/>
            <path d="M236 76 L182 100" stroke="var(--border)" stroke-width="1.5"/>
            <path d="M80 185 L140 160" stroke="var(--border)" stroke-width="1.5"/>
            <path d="M240 188 L182 160" stroke="var(--border)" stroke-width="1.5"/>
        </svg>
    </div>
</section>

</body>
</html>
